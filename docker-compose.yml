services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: scanner-db
    environment:
      POSTGRES_USER: scanner
      POSTGRES_PASSWORD: scanner123
      POSTGRES_DB: network_scanner
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - scanner-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scanner"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis Cache & Message Broker
  redis:
    image: redis:7-alpine
    container_name: scanner-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - scanner-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scanner-backend
    environment:
      - ENV=production
      - DATABASE_URL=postgresql://scanner:scanner123@db:5432/network_scanner
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - API_RELOAD=false
      - LOG_LEVEL=INFO
      - CORS_ORIGINS=["http://localhost", "http://localhost:80"]
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - scanner-network
    cap_add:
      - NET_RAW
      - NET_ADMIN
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/app/docker-entrypoint.sh"]
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  # Celery Worker
  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scanner-celery
    environment:
      - ENV=production
      - DATABASE_URL=postgresql://scanner:scanner123@db:5432/network_scanner
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - LOG_LEVEL=INFO
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - scanner-network
    cap_add:
      - NET_RAW
      - NET_ADMIN
    restart: unless-stopped
    command: ["celery", "-A", "app.celery_app", "worker", "--loglevel=info", "--pool=solo"]

  # Celery Beat (scheduler only: DB bookkeeping + enqueue, no scan privileges)
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scanner-beat
    environment:
      - ENV=production
      - DATABASE_URL=postgresql://scanner:scanner123@db:5432/network_scanner
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - scanner-network
    restart: unless-stopped
    command: ["celery", "-A", "app.celery_app", "beat", "--loglevel=info"]

  # React Frontend with Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: scanner-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - scanner-network
    restart: unless-stopped

networks:
  scanner-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
