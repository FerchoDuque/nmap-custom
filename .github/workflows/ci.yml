name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/uv.lock
      - name: Install uv
        run: pip install uv==0.10.9
      - name: Install dependencies from uv.lock
        run: |
          uv export --frozen --extra dev --no-emit-project --format requirements-txt --no-header -o requirements-ci.txt
          pip install -r requirements-ci.txt
      - name: Run tests
        run: python -m pytest tests/api tests/core -q
        env:
          PYTHONPATH: .
          DATABASE_URL: "sqlite:///:memory:"

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:run
      - name: Build
        run: npm run build

  compose:
    name: Compose config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Validate production compose
        run: docker compose -f docker-compose.yml config --quiet
      - name: Validate development compose
        run: docker compose -f docker-compose.dev.yml config --quiet
